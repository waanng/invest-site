name: Update Macro Data

on:
  schedule:
    # PMI通常月初发布，PPI通常每月上旬发布；北京时间 10:00 运行
    - cron: '0 2 1,2,10,11 * *'

  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install akshare pandas

    - name: Fetch macro data
      run: |
        cd projects/asset-rotation
        python scripts/fetch_macro_data.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add projects/asset-rotation/data/macro_data.json
        git diff --staged --quiet || (git commit -m "Update macro data: $(date +'%Y-%m-%d')" && git push)
